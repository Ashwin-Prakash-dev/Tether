services:
  - type: cron
    name: polymarket-whale-checker
    env: python
    schedule: "*/2 * * * *"  # 2 minutes
    buildCommand: pip install -r requirements.txt
    startCommand: python cron_check.py
    envVars:
      - key: PUSHOVER_API_TOKEN
        sync: false
      - key: PUSHOVER_USER_KEY
        sync: false
      - key: REDIS_URL
        sync: false
